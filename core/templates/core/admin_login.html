{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <img src="{% static 'core/images/glec-logo.png' %}" alt="GLEC Logo" class="logo">
            <h2>Admin Login</h2>
            <p>Faculty Invigilation Assignment</p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="login-footer">
            <p>GLEC Faculty Invigilation System &copy; {{ year }}</p>
        </div>
    </div>
</div>
{% endblock %}

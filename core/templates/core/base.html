{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLEC Invigilation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg shadow-sm" style="padding: 0.9rem 0;">
        <div class="container-fluid">
            <a href="https://glwec.in/" target="_blank" class="d-flex align-items-center text-decoration-none">
                <img src="{% static 'core/images/glec-logo.png' %}" alt="GLEC Logo" style="height:48px;">
            </a>
            <div class="d-flex align-items-center ms-auto">
                <ul class="navbar-nav mb-0 d-flex flex-row align-items-center">
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-uppercase"
                           style="color:#8a0d26; font-size:1.1rem; letter-spacing:0.5px;"
                           href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link fw-bold text-uppercase"
                           style="color:#8a0d26; font-size:1.1rem; letter-spacing:0.5px;"
                           href="{% url 'manage_exam_sessions' %}">Exams</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link fw-bold text-uppercase"
                           style="color:#8a0d26; font-size:1.1rem; letter-spacing:0.5px;"
                           href="{% url 'logout' %}">Logout</a>
                    </li>
                    <li class="nav-item ms-3">
                        <a class="nav-link fw-bold text-uppercase"
                           style="color:#8a0d26; font-size:1.1rem; letter-spacing:0.5px;"
                           href="https://glwec.in/" target="_blank">GLEC</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
